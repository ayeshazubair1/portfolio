<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Ayesha Zubair</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .not-found {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }
    .not-found-code {
      font-family: var(--font-head);
      font-size: clamp(3rem, 10vw, 6rem);
      color: var(--text);
      line-height: 1;
      margin-bottom: 16px;
    }
    .not-found-msg {
      color: var(--text-secondary);
      max-width: 40ch;
      margin-bottom: 32px;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="not-found">
    <div class="hero-label">404</div>
    <div class="not-found-code">Page not found</div>
    <p class="not-found-msg">
      The page you're looking for may have been moved or doesn't exist.
    </p>
    <a href="index.html" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Return Home
    </a>
  </div>
</body>
</html>
